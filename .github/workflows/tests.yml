name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dépendances labo
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24"
      - name: Suite hors OTS
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install "numpy>=1.24"
      - name: Commandes d'entrée
        env:
          PYTHONPATH: src
        run: |
          python -m mvcg registers > /tmp/reg.json
          python -m mvcg dictionaries > /tmp/dic.json
          python -c "import json; json.load(open('/tmp/reg.json')); json.load(open('/tmp/dic.json'))"

  unit-ots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances + OTS
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24" "opentimestamps>=0.4.5"
      - name: Suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q
